name: "test action"

on:
  workflow_dispatch:

permissions:
  contents: "read"

defaults:
  run:
    shell: "bash"
    working-directory: "."

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - name: "test"
        run: |
          file=$(mktemp)
          echo 'hello' >> "$file"
          echo "$(cksum -a sha256 --untagged "$@" ${file})"
          echo "$(cksum -a sha256 --untagged ${file})"
          printf 'test\n' 1>&2
          printf '::error::invalid "packageManager" in package.json%0A\naaaa\n'
          exit 1;
